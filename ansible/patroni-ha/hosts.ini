[db_nodes]
pg-node1 ansible_host=192.168.100.101 etcd_name=node1.test.loc node_ip=192.168.100.101
pg-node2 ansible_host=192.168.100.102 etcd_name=node2.test.loc node_ip=192.168.100.102
pg-node3 ansible_host=192.168.100.103 etcd_name=node3.test.loc node_ip=192.168.100.103

[db_nodes:vars]
ansible_user=root
# Аутентификация — по SSH-ключам (см. Quick Start в статье), поэтому ansible_password
# здесь не задаётся. Если в вашей сети используется парольный доступ, храните пароль
# в зашифрованном group_vars/db_nodes/vault.yml (см. vault.yml.example), а не в hosts.ini.

# Параметры СУБД Postgres Pro 1C
pg_version=16
pg_bin_dir=/opt/pgpro/1c-16/bin
pg_data_dir=/var/lib/pgpro/1c-16/data

# Параметры виртуального IP (VIP)
vip_address=192.168.100.10
vip_netmask=24
vip_interface=eth0

# Консенсус-токен etcd
etcd_cluster_token=etcd-1c-token

# Подсеть, из которой разрешено подключение к PostgreSQL (pg_hba.conf).
# Не используйте 0.0.0.0/0 в продакшене — ограничьте её реальной подсетью кластера/приложений.
pg_hba_subnet=192.168.100.0/24

# Пароли СУБД (patroni_superuser_password, patroni_replication_password,
# patroni_rewind_password) сюда не помещаются — задайте их в зашифрованном
# group_vars/db_nodes/vault.yml. Смотрите vault.yml.example и раздел README
# "Секреты и Ansible Vault".
