stages:
  - test
  - deploy
  - smoke-test

variables:
  DB_CONNECTION: "/F"/var/lib/gitlab-runner/builds/1c-db""
  EXT_NAME: "MyCustomExtension"
  DB_USER: "Admin"
  DB_PASS: "SecurePassword123"
  APP_URL: "http://127.0.0.1/my-base"

# Шаг 1: Тестирование и запуск скрипта синтаксического контроля с 5 слоями защиты
run-syntax-check:
  stage: test
  tags:
    - 1c-linux-runner
  before_script:
    - chmod +x ./scripts/1c-ci-linux-build-v4.sh
  script:
    - ./scripts/1c-ci-linux-build-v4.sh -c "$DB_CONNECTION" -e "$EXT_NAME" -u "$DB_USER" -w "$DB_PASS" -s "./src/extension"
  artifacts:
    when: always
    paths:
      - /tmp/1c_log_*.txt
      - /tmp/1c_err_*.txt
    expire_in: 1 week

# Шаг 2: Безопасная накатка изменений (Deployment)
deploy-to-stage:
  stage: deploy
  only:
    - main
  tags:
    - 1c-linux-runner
  script:
    - echo "[*] Принудительный сброс активных пользовательских соединений..."
    - /opt/1cv8/x86_64/current/rac session --cluster=$(/opt/1cv8/x86_64/current/rac cluster list | grep cluster | head -n1 | awk '{print $3}') terminate --base=my-base || true
    - echo "[*] Монопольное применение конфигурации базы данных..."
    - xvfb-run -a /opt/1cv8/x86_64/current/1cv8 DESIGNER $DB_CONNECTION /N "$DB_USER" /P "$DB_PASS" /UpdateDBCfg /Force
  dependencies:
    - run-syntax-check

# Шаг 3: Верификация работоспособности сервиса (Smoke-тест через curl)
run-smoke-test:
  stage: smoke-test
  only:
    - main
  tags:
    - 1c-linux-runner
  script:
    - echo "[*] Проверяем доступность веб-интерфейса через curl..."
    - curl -s -f -I -H "Accept: text/html" "$APP_URL/ru_RU/" | grep "200 OK"
